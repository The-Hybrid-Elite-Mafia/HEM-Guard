name: HEM Guard - build, test, package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (the real test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Run every automated test
        shell: pwsh
        run: |
          .\build\Release\hem_guard_tests.exe --report test-report.md
          $code = $LASTEXITCODE
          Get-Content test-report.md | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code

      - name: Demo on made-up files (must say DEMO PASSED)
        shell: pwsh
        run: |
          $out = .\build\Release\hem_guard_cli.exe demo | Out-String
          Write-Host $out
          if ($out -notmatch "DEMO PASSED") { throw "demo did not pass" }

      - name: Real command-line smoke test on a throwaway folder
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "hg-smoke"
          New-Item -ItemType Directory -Force $d | Out-Null
          "HEM-GUARD-DEMO-MARKER-0001 harmless" | Set-Content (Join-Path $d "marker.dat")
          "just text" | Set-Content (Join-Path $d "invoice.pdf.exe")
          .\build\Release\hem_guard_cli.exe scan $d --rules rules\hem_rules.txt --hashes rules\hem_known_bad_hashes.txt --cpu 0.5
          if ($LASTEXITCODE -ne 2) { throw "scan should have exited 2 (found things), got $LASTEXITCODE" }
          .\build\Release\hem_guard_cli.exe storage $d
          .\build\Release\hem_guard_cli.exe clean
          .\build\Release\hem_guard_cli.exe startup list
          .\build\Release\hem_guard_cli.exe version

      - name: Stage the program folder
        if: always()
        shell: pwsh
        run: |
          $d = "dist\HEM-Guard"
          New-Item -ItemType Directory -Force "$d\rules" | Out-Null
          Copy-Item build\Release\hem_guard_cli.exe $d
          Copy-Item build\Release\hem_guard_gui.exe "$d\HEM-Guard.exe"
          Copy-Item rules\*.txt "$d\rules"

      - name: Window self-test (opens the real window, drives every tab on made-up files, takes screenshots)
        shell: pwsh
        run: |
          $sb = Join-Path $env:RUNNER_TEMP "hg-gui-selftest"
          New-Item -ItemType Directory -Force $sb | Out-Null
          $p = Start-Process -FilePath "dist\HEM-Guard\HEM-Guard.exe" -ArgumentList @("--selftest", $sb) -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Host "TIMED OUT"; $code = 99 } else { $code = $p.ExitCode }
          if (Test-Path "$sb\selftest-result.txt") { Get-Content "$sb\selftest-result.txt" | Tee-Object -Variable res | Write-Host; ("### Window self-test`n```" + "`n" + ($res -join "`n") + "`n```") | Add-Content $env:GITHUB_STEP_SUMMARY } else { Write-Host "no result file was written" }
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force screenshots | Out-Null
          Get-ChildItem "$sb\shots\*.bmp" -ErrorAction SilentlyContinue | ForEach-Object {
            $img = [System.Drawing.Image]::FromFile($_.FullName)
            $img.Save((Join-Path "screenshots" ($_.BaseName + ".png")), [System.Drawing.Imaging.ImageFormat]::Png)
            $img.Dispose()
          }
          if ($code -ne 0) { throw "window self-test failed with exit code $code" }

      - name: Publish screenshots (so they can be looked at)
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path screenshots)) { exit 0 }
          $t = Join-Path $env:RUNNER_TEMP "shots-repo"
          New-Item -ItemType Directory -Force $t | Out-Null
          Copy-Item screenshots\*.png $t
          Push-Location $t
          git init -q -b ci-screenshots
          git config user.name "HEM Guard CI"
          git config user.email "ci@hem.invalid"
          git add .
          git commit -q -m "window screenshots from run ${{ github.run_id }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots
          Pop-Location

      - name: Package the Windows zip
        if: always()
        shell: pwsh
        run: |
          $d = "dist\HEM-Guard"
          Copy-Item packaging\* $d
          Copy-Item docs\GUIDE.txt $d
          if (Test-Path test-report.md) { Copy-Item test-report.md "$d\TEST-REPORT.md" }
          Compress-Archive -Path $d -DestinationPath HEM-Guard-windows-x64.zip -Force
          (Get-FileHash HEM-Guard-windows-x64.zip -Algorithm SHA256).Hash | Set-Content HEM-Guard-windows-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HEM-Guard-windows-x64
          path: |
            HEM-Guard-windows-x64.zip
            HEM-Guard-windows-x64.zip.sha256
            test-report.md

  linux:
    name: Linux (extra check, same tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - name: Run every automated test
        run: |
          ./build/hem_guard_tests --report test-report-linux.md
          code=$?
          cat test-report-linux.md >> "$GITHUB_STEP_SUMMARY"
          exit $code
